name: 'Tizen60UpdateControl'
description: 'Dart bindings for Tizen update-control APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_update_control.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-update-control.h'
  include-directives:
    - '**/update_control.h'

library-imports:
  time: 'generated_bindings_time.dart'

type-map:
  structs:
    'tm':
      lib: 'time'
      c-type: 'tm'
      dart-type: 'tm'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/system/'

enums:
  rename:
    '_+(.*)': '$1'
