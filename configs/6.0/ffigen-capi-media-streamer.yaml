  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60CapiMediaStreamer'
description: 'Dart bindings for Tizen capi-media-streamer APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_media_streamer.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-media-streamer.h'
  include-directives:
    - '**/media_streamer.h'

library-imports:
  bundle: 'generated_bindings_bundle.dart'
  media_tool: 'generated_bindings_capi_media_tool.dart'

type-map:
  typedefs:
    'bundle':
      lib: 'bundle'
      c-type: 'bundle'
      dart-type: 'bundle'
    'media_format_h':
      lib: 'media_tool'
      c-type: 'media_format_h'
      dart-type: 'media_format_h'
    'media_packet_h':
      lib: 'media_tool'
      c-type: 'media_packet_h'
      dart-type: 'media_packet_h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/media/'

enums:
  rename:
    '_+(.*)': '$1'
