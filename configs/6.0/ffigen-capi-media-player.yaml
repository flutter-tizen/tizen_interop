name: 'Tizen60CapiMediaPlayer'
description: 'Dart bindings for Tizen capi-media-player APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_media_player.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-media-player.h'
  include-directives:
    - '**/player.h'

library-imports:
  media_tool: 'generated_bindings_capi_media_tool.dart'
  sound_manager: 'generated_bindings_capi_media_sound_manager.dart'

type-map:
  typedefs:
    'media_format_h':
      lib: 'media_tool'
      c-type: 'media_format_h'
      dart-type: 'media_format_h'
    'media_packet_h':
      lib: 'media_tool'
      c-type: 'media_packet_h'
      dart-type: 'media_packet_h'
    'sound_stream_info_h':
      lib: 'sound_manager'
      c-type: 'sound_stream_info_h'
      dart-type: 'sound_stream_info_h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/media/'

enums:
  rename:
    '_+(.*)': '$1'
    'media_format_mimetype_e': '_media_format_mimetype_e'
