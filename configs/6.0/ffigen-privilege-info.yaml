name: 'Tizen60PrivilegeInfo'
description: 'Dart bindings for Tizen privilege-info APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_privilege_info.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-privilege-info.h'
  include-directives:
    - '**/privilege_information.h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/glib-2.0/'
  - '-I./rootstraps/6.0/usr/lib/glib-2.0/include/'

enums:
  rename:
    '_+(.*)': '$1'
