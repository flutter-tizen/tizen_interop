  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60CapiSystemUsbhost'
description: 'Dart bindings for Tizen capi-system-usbhost APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_system_usbhost.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-system-usbhost.h'
  include-directives:
    - '**/usb_host.h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  
enums:
  rename:
    '_+(.*)': '$1'
