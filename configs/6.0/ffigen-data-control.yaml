name: 'Tizen60DataControl'
description: 'Dart bindings for Tizen data-control APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_data_control.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-data-control.h'
  include-directives:
    - '**/data_control.h'
    - '**/data_control_sql.h'
    - '**/data_control_map.h'
    - '**/data_control_provider.h'
    - '**/data_control_noti.h'
    - '**/data_control_bulk.h'
    - '**/data_control_sql_cursor.h'

library-imports:
  bundle: 'generated_bindings_bundle.dart'

type-map:
  typedefs:
    'bundle':
      lib: 'bundle'
      c-type: 'bundle'
      dart-type: 'bundle'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/appfw/'

enums:
  rename:
    '_+(.*)': '$1'
