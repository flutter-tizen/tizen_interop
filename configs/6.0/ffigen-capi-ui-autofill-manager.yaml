name: 'Tizen60CapiUiAutofillManager'
description: 'Dart bindings for Tizen capi-ui-autofill-manager APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_ui_autofill_manager.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-ui-autofill-manager.h'
  include-directives:
    - '**/autofill_manager.h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/autofill/'

enums:
  rename:
    '_+(.*)': '$1'
