  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60CapiAppfwAlarm'
description: 'Dart bindings for Tizen capi-appfw-alarm APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_appfw_alarm.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-appfw-alarm.h'
  include-directives:
    - '**/app_alarm.h'

library-imports:
  app_control: 'generated_bindings_capi_appfw_app_control.dart'
  notification: 'generated_bindings_notification.dart'
  time: 'generated_bindings_time.dart'

type-map:
  typedefs:
    'app_control_h':
      lib: 'app_control'
      c-type: 'app_control_h'
      dart-type: 'app_control_h'
    'notification_h':
      lib: 'notification'
      c-type: 'notification_h'
      dart-type: 'notification_h'
  structs:
    'tm':
      lib: 'time'
      c-type: 'tm'
      dart-type: 'tm'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/appfw/'
  - '-I./rootstraps/6.0/usr/include/notification/'

enums:
  rename:
    '_+(.*)': '$1'
