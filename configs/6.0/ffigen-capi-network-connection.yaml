name: 'Tizen60CapiNetworkConnection'
description: 'Dart bindings for Tizen capi-network-connection APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_network_connection.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-network-connection.h'
  include-directives:
    - '**/net_connection.h'
    - '**/connection_profile.h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/network/'

enums:
  rename:
    '_+(.*)': '$1'
