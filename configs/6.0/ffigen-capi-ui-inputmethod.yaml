  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60CapiUiInputmethod'
description: 'Dart bindings for Tizen capi-ui-inputmethod APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_ui_inputmethod.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-ui-inputmethod.h'
  include-directives:
    - '**/inputmethod.h'
    - '**/inputmethod_keydef.h'
    - '**/inputmethod_device_event.h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/inputmethod/'
  - '-I./rootstraps/6.0/usr/include/ecore-imf-1/'
  - '-I./rootstraps/6.0/usr/include/eina-1/'
  - '-I./rootstraps/6.0/usr/include/eina-1/eina/'
  - '-I./rootstraps/6.0/usr/include/evas-1/'
  - '-I./rootstraps/6.0/usr/include/eo-1/'
  - '-I./rootstraps/6.0/usr/include/efl-1/'
  - '-I./rootstraps/6.0/usr/include/emile-1/'

enums:
  rename:
    '_+(.*)': '$1'
