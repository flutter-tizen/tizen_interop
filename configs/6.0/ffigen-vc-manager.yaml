  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60VcManager'
description: 'Dart bindings for Tizen vc_manager APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_vc_manager.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-vc_manager.h'
  include-directives:
    - '**/voice_control_manager.h'

library-imports:
  vc: 'generated_bindings_vc.dart'

type-map:
  typedefs:
    'vc_supported_language_cb':
      lib: 'vc'
      c-type: 'vc_supported_language_cb'
      dart-type: 'vc_supported_language_cb'
    'vc_cmd_list_h':
      lib: 'vc'
      c-type: 'vc_cmd_list_h'
      dart-type: 'vc_cmd_list_h'
    'vc_result_cb':
      lib: 'vc'
      c-type: 'vc_result_cb'
      dart-type: 'vc_result_cb'
    'vc_state_changed_cb':
      lib: 'vc'
      c-type: 'vc_state_changed_cb'
      dart-type: 'vc_state_changed_cb'
    'vc_service_state_changed_cb':
      lib: 'vc'
      c-type: 'vc_service_state_changed_cb'
      dart-type: 'vc_service_state_changed_cb'
    'vc_current_language_changed_cb':
      lib: 'vc'
      c-type: 'vc_current_language_changed_cb'
      dart-type: 'vc_current_language_changed_cb'
    'vc_error_cb':
      lib: 'vc'
      c-type: 'vc_error_cb'
      dart-type: 'vc_error_cb'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'

enums:
  rename:
    '_+(.*)': '$1'
    'vc_state_e': '_vc_state_e'
    'vc_service_state_e': '_vc_service_state_e'
    'vc_result_event_e': '_vc_result_event_e'
    'vc_audio_channel_e': '_vc_audio_channel_e'
    'vc_audio_type_e': '_vc_audio_type_e'
    'vc_feedback_event_e': '_vc_feedback_event_e'
    'vc_tts_utterance_status_e': '_vc_tts_utterance_status_e'

macros:
  exclude:
    - 'VC_COMMAND_TYPE_FOREGROUND'
    - 'VC_COMMAND_TYPE_BACKGROUND'
    - 'VC_RESULT_MESSAGE_NONE'
    - 'VC_RESULT_MESSAGE_ERROR_TOO_LOUD'
