name: 'Tizen60PhonenumberUtils'
description: 'Dart bindings for Tizen phonenumber-utils APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_phonenumber_utils.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-phonenumber-utils.h'
  include-directives:
    - '**/phone_number.h'
    - '**/phone_number_types.h'
    - '**/phone_number_errors.h'
    - '**/phone_number_blocking_rule.h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/phonenumber-utils/'

enums:
  rename:
    '_+(.*)': '$1'
