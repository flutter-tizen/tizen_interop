preamble: |
  // Copyright 2021 Samsung Electronics Co., Ltd. All rights reserved.
  // Use of this source code is governed by a BSD-style license that can be
  // found in the LICENSE file.
  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60CapiMediaRecorder'
description: 'Dart bindings for Tizen capi-media-recorder APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_media_recorder.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints.h'
  include-directives:
    - '**/recorder.h'

library-imports:
  camera: 'generated_bindings_capi_media_camera.dart'
  sound_manager: 'generated_bindings_capi_media_sound_manager.dart'

type-map:
  typedefs:
    'camera_h':
      lib: 'camera'
      c-type: 'camera_h'
      dart-type: 'camera_h'
    'recorder_video_data_s':
      lib: 'camera'
      c-type: 'camera_preview_data_s'
      dart-type: 'camera_preview_data_s'
    'sound_stream_info_h':
      lib: 'sound_manager'
      c-type: 'sound_stream_info_h'
      dart-type: 'sound_stream_info_h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'

  # include Tizen API directories
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/appcore-agent/'
  - '-I./rootstraps/6.0/usr/include/appfw/'
  - '-I./rootstraps/6.0/usr/include/asp/'
  - '-I./rootstraps/6.0/usr/include/badge/'
  - '-I./rootstraps/6.0/usr/include/calendar-service2/'
  - '-I./rootstraps/6.0/usr/include/cbhm/'
  - '-I./rootstraps/6.0/usr/include/ckm/'
  - '-I./rootstraps/6.0/usr/include/contacts-svc/'
  - '-I./rootstraps/6.0/usr/include/content/'
  - '-I./rootstraps/6.0/usr/include/context-service/'
  - '-I./rootstraps/6.0/usr/include/csr/'
  - '-I./rootstraps/6.0/usr/include/device-certificate-manager/'
  - '-I./rootstraps/6.0/usr/include/dlog/'
  - '-I./rootstraps/6.0/usr/include/eom/'
  - '-I./rootstraps/6.0/usr/include/feedback/'
  - '-I./rootstraps/6.0/usr/include/geofence/'
  - '-I./rootstraps/6.0/usr/include/iotcon/'
  - '-I./rootstraps/6.0/usr/include/location/'
  - '-I./rootstraps/6.0/usr/include/media/'
  - '-I./rootstraps/6.0/usr/include/media-content/'
  - '-I./rootstraps/6.0/usr/include/messaging/'
  - '-I./rootstraps/6.0/usr/include/metadata-editor/'
  - '-I./rootstraps/6.0/usr/include/network/'
  - '-I./rootstraps/6.0/usr/include/notification/'
  - '-I./rootstraps/6.0/usr/include/notification-ex/api/'
  - '-I./rootstraps/6.0/usr/include/nsd/'
  - '-I./rootstraps/6.0/usr/include/phonenumber-utils/'
  - '-I./rootstraps/6.0/usr/include/privacy-privilege-manager/'
  - '-I./rootstraps/6.0/usr/include/rpc-port/'
  - '-I./rootstraps/6.0/usr/include/sensor/'
  - '-I./rootstraps/6.0/usr/include/shortcut/'
  - '-I./rootstraps/6.0/usr/include/storage/'
  - '-I./rootstraps/6.0/usr/include/system/'
  - '-I./rootstraps/6.0/usr/include/web/'
  - '-I./rootstraps/6.0/usr/include/wifi-direct/'
  - '-I./rootstraps/6.0/usr/include/yaca/'

  # include EFL directories
  - '-I./rootstraps/6.0/usr/include/ecore-imf-1/'
  - '-I./rootstraps/6.0/usr/include/efl-1/'
  - '-I./rootstraps/6.0/usr/include/eina-1/'
  - '-I./rootstraps/6.0/usr/include/eina-1/eina/'
  - '-I./rootstraps/6.0/usr/include/emile-1/'
  - '-I./rootstraps/6.0/usr/include/eo-1/'
  - '-I./rootstraps/6.0/usr/include/evas-1/'

  # include glib directories
  - '-I./rootstraps/6.0/usr/include/glib-2.0/'
  - '-I./rootstraps/6.0/usr/lib/glib-2.0/include/'

enums:
  rename:
    '_+(.*)': '$1'
    'audio_sample_type_e' : '_audio_sample_type_e'
