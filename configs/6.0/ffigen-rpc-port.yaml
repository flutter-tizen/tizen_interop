name: 'Tizen60RpcPort'
description: 'Dart bindings for Tizen rpc-port APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_rpc_port.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-rpc-port.h'
  include-directives:
    - '**/rpc-port.h'
    - '**/rpc-port-parcel.h'

library-imports:
  bundle: 'generated_bindings_bundle.dart'

type-map:
  typedefs:
    'bundle':
      lib: 'bundle'
      c-type: 'bundle'
      dart-type: 'bundle'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/appfw/'
  - '-I./rootstraps/6.0/usr/include/rpc-port/'

enums:
  rename:
    '_+(.*)': '$1'
