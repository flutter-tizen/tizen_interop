name: 'Tizen60Dpm'
description: 'Dart bindings for Tizen dpm APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_dpm.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-dpm.h'
  include-directives:
    - '**/device-policy-manager.h'
    - '**/password.h'
    - '**/restriction.h'
    - '**/security.h'
    - '**/zone.h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/dpm/'

enums:
  rename:
    '_+(.*)': '$1'
