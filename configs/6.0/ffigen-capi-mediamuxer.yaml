name: 'Tizen60CapiMediamuxer'
description: 'Dart bindings for Tizen capi-mediamuxer APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_mediamuxer.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-mediamuxer.h'
  include-directives:
    - '**/mediamuxer.h'

library-imports:
  media_tool: 'generated_bindings_capi_media_tool.dart'

type-map:
  typedefs:
    'media_format_h':
      lib: 'media_tool'
      c-type: 'media_format_h'
      dart-type: 'media_format_h'
    'media_packet_h':
      lib: 'media_tool'
      c-type: 'media_packet_h'
      dart-type: 'media_packet_h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/media/'

enums:
  rename:
    '_+(.*)': '$1'
