  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60Push'
description: 'Dart bindings for Tizen push APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_push.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-push.h'
  include-directives:
    - '**/push-service.h'

library-imports:
  app_control: 'generated_bindings_capi_appfw_app_control.dart'

type-map:
  typedefs:
    'app_control_h':
      lib: 'app_control'
      c-type: 'app_control_h'
      dart-type: 'app_control_h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/messaging/'
  - '-I./rootstraps/6.0/usr/include/appfw/'

enums:
  rename:
    '_+(.*)': '$1'
