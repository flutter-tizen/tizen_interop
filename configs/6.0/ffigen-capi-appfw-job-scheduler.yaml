  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60CapiAppfwJobScheduler'
description: 'Dart bindings for Tizen capi-appfw-job-scheduler APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_appfw_job_scheduler.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-appfw-job-scheduler.h'
  include-directives:
    - '**/job_error.h'
    - '**/job_info.h'
    - '**/job_scheduler.h'
    
compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/appfw/'

enums:
  rename:
    '_+(.*)': '$1'
