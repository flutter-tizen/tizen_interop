name: 'Tizen60Vc'
description: 'Dart bindings for Tizen vc APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_vc.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-vc.h'
  include-directives:
    - '**/voice_control.h'
    - '**/voice_control_command.h'
    - '**/voice_control_common.h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'

enums:
  rename:
    '_+(.*)': '$1'
