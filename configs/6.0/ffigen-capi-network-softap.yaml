  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60CapiNetworkSoftap'
description: 'Dart bindings for Tizen capi-network-softap APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_network_softap.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-network-softap.h'
  include-directives:
    - '**/softap.h'

library-imports:
  ffi_lib: 'dart:ffi'

type-map:
  typedefs:
    'time_t':
      lib: 'ffi_lib'
      c-type: 'Long'
      dart-type: 'int'
    '__time_t':
      lib: 'ffi_lib'
      c-type: 'Long'
      dart-type: 'int'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/network/'

enums:
  rename:
    '_+(.*)': '$1'
