name: 'Tizen60CapiMediaTool'
description: 'Dart bindings for Tizen capi-media-tool APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_media_tool.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-media-tool.h'
  include-directives:
    - '**/media_format.h'
    - '**/media_packet.h'
    - '**/media_packet_pool.h'

library-imports:
  tbm_surface: 'generated_bindings_tbm.dart'

type-map:
  typedefs:
    'tbm_surface_h':
      lib: 'tbm_surface'
      c-type: 'tbm_surface_h'
      dart-type: 'tbm_surface_h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/media/'

enums:
  rename:
    '_+(.*)': '$1'
