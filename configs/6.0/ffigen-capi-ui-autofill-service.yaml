  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60CapiUiAutofillService'
description: 'Dart bindings for Tizen capi-ui-autofill-service APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_ui_autofill_service.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-ui-autofill-service.h'
  include-directives:
    - '**/autofill_service.h'

library-imports:
  autofill_common: 'generated_bindings_capi_ui_autofill_common.dart'

type-map:
  typedefs:
    'autofill_view_info_h':
      lib: 'autofill_common'
      c-type: 'autofill_view_info_h'
      dart-type: 'autofill_view_info_h'
    'autofill_auth_info_h':
      lib: 'autofill_common'
      c-type: 'autofill_auth_info_h'
      dart-type: 'autofill_auth_info_h'
    'autofill_fill_response_h':
      lib: 'autofill_common'
      c-type: 'autofill_fill_response_h'
      dart-type: 'autofill_fill_response_h'
    'autofill_save_view_info_h':
      lib: 'autofill_common'
      c-type: 'autofill_save_view_info_h'
      dart-type: 'autofill_save_view_info_h'
    'autofill_error_info_h':
      lib: 'autofill_common'
      c-type: 'autofill_error_info_h'
      dart-type: 'autofill_error_info_h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/autofill/'

enums:
  rename:
    '_+(.*)': '$1'
