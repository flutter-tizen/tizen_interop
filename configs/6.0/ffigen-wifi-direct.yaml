  // ignore_for_file: type=lint, unused_element, unused_field

name: 'Tizen60WifiDirect'
description: 'Dart bindings for Tizen wifi-direct APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_wifi_direct.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-wifi-direct.h'
  include-directives:
    - '**/wifi-direct.h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/wifi-direct/'

enums:
  rename:
    '_+(.*)': '$1'
