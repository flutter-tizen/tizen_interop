name: 'Tizen60CapiMediaAudioIo'
description: 'Dart bindings for Tizen capi-media-audio-io APIs.'
output: '../../lib/src/bindings/6.0/generated_bindings_capi_media_audio_io.dart'

llvm-path:
  - '/usr/lib/llvm-12'

headers:
  entry-points:
    - 'entrypoints-capi-media-audio-io.h'
  include-directives:
    - '**/audio_io.h'

library-imports: 
  sound_manager: 'generated_bindings_capi_media_sound_manager.dart'

type-map:
  typedefs:
    'sound_stream_info_h':
      lib: 'sound_manager'
      c-type: 'sound_stream_info_h'
      dart-type: 'sound_stream_info_h'

compiler-opts:
  - '-m32'
  - '-Wno-incomplete-setjmp-declaration'
  - '-I./rootstraps/6.0/usr/include/'
  - '-I./rootstraps/6.0/usr/include/media/'

enums:
  rename:
    '_+(.*)': '$1'
    'sound_type_e': '_sound_type_e'
